version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wissen67
      POSTGRES_DB: taxonomy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: web_app/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:wissen67@db:5432/taxonomy_db
      - IN_DOCKER=1
      # Assuming .env handles API keys, but passing explicitly is safer
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  frontend:
    build:
      context: ./web_app/ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
