version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: web_app/backend/Dockerfile
    ports:
      - "8518:8000"
    environment:
      - IN_DOCKER=1
      # Database URL and API keys will be pulled directly from your .env file
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./web_app/ui
      dockerfile: Dockerfile
    ports:
      - "8519:80"
    depends_on:
      - backend
